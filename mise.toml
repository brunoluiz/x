[tasks.test]
run = 'for module in core/v2 logger/v2 http/v2 o11y/v2 otel/v2 database/postgres/v2 database/postgres/otel/v2 database/sqlite/v2 database/migrate/v2 app/v2 connectrpc/v2 samples; do (cd "$module" && go test ./...) || exit 1; done'

[tasks."format:check"]
run = '[ -z "$(gofumpt -d .)" ] && echo "No formatting needed" || echo "gofumpt failed"'

[tasks.format]
run = "gofumpt -l -w ."

[tasks.generate]
run = 'for module in core/v2 logger/v2 http/v2 o11y/v2 otel/v2 database/postgres/v2 database/postgres/otel/v2 database/sqlite/v2 database/migrate/v2 app/v2 connectrpc/v2 samples; do (cd "$module" && go generate ./...) || exit 1; done'

[tasks.lint]
run = 'for module in core/v2 logger/v2 http/v2 o11y/v2 otel/v2 database/postgres/v2 database/postgres/otel/v2 database/sqlite/v2 database/migrate/v2 app/v2 connectrpc/v2 samples; do (cd "$module" && golangci-lint run ./...) || exit 1; done'

[tools]
gofumpt = "0.9.1"
golangci-lint = "2.12.2"
lefthook = "1.13.6"
go = "1.26.1"
